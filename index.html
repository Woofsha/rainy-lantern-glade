    for (let i = 0; i < count; i++) {
      dabs.push({
        x: lerp(box[0], box[2], rnd()),
        y: lerp(box[1], box[3], rnd()),
        rx: 0.005 + rnd() * 0.014,
        ry: 0.004 + rnd() * 0.008,
        rot: rnd() * TAU,
        c: rnd(),
        a: 0.10 + rnd() * 0.22,
      });
    }
    return dabs;
  }

  function fillDabs(g, dabs, pal) {
    for (const d of dabs) {
      g.fillStyle = col(d.c < 0.52 ? pal.shadow : pal.lit, d.a);
      g.beginPath();
      g.ellipse(d.x, d.y, d.rx, d.ry, d.rot, 0, TAU);
      g.fill();
    }
  }

  function drawEye(g, x, y, rx, ry, pal, blink) {
    g.save();
    g.translate(x, y);
    if (blink) {
      g.strokeStyle = col(pal.eye, 0.9);
      g.lineWidth = 0.012;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-rx, 0);
      g.quadraticCurveTo(0, ry * 0.9, rx, 0);
      g.stroke();
    } else {
      g.fillStyle = col(pal.eye);
      g.beginPath();
      g.ellipse(0, 0, rx, ry, 0, 0, TAU);
      g.fill();
      g.fillStyle = hsl(46, 32, 94, 0.95);
      g.beginPath();
      g.arc(rx * 0.28, -ry * 0.34, rx * 0.34, 0, TAU);
      g.fill();
      g.fillStyle = hsl(200, 40, 80, 0.4);
      g.beginPath();
      g.arc(-rx * 0.25, ry * 0.3, rx * 0.18, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawLeg(g, hx, hy, len, phase, lift, tone, rimCol, w) {
    const swing = Math.sin(phase) * 0.6;
    const fx = hx + swing * len * 0.55;
    const fy = -Math.max(0, Math.cos(phase)) * lift;
    const cx = hx + swing * len * 0.16;
    const cy = hy + len * 0.62;
    g.lineCap = 'round';
    g.strokeStyle = tone;
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(hx, hy);
    g.quadraticCurveTo(cx, cy, fx, fy - w * 0.30);
    g.stroke();
    if (rimCol) {
      g.strokeStyle = rimCol;
      g.lineWidth = w * 0.32;
      g.beginPath();
      g.moveTo(hx + w * 0.26, hy);
      g.quadraticCurveTo(cx + w * 0.26, cy, fx + w * 0.26, fy - w * 0.30);
      g.stroke();
    }
    g.fillStyle = tone;
    g.beginPath();
    g.ellipse(fx, fy - w * 0.18, w * 0.62, w * 0.40, 0, 0, TAU);
    g.fill();
  }

  function shadeBody(g, sil, box, pal, dabs, rimPts, rimCol, rimAlpha) {
    g.save();
    g.clip(sil);
    const gr = g.createLinearGradient(box[2], box[1], box[0], box[3]);
    gr.addColorStop(0.00, col(pal.lit));
    gr.addColorStop(0.30, col(pal.base));
    gr.addColorStop(0.72, col(pal.shadow));
    gr.addColorStop(1.00, col(pal.deep));
    g.fillStyle = gr;
    g.fillRect(box[0] - 0.1, box[1] - 0.1, box[2] - box[0] + 0.2, box[3] - box[1] + 0.2);

    const oc = g.createLinearGradient(0, box[3], 0, box[1]);
    oc.addColorStop(0, col(pal.deep, 0.55));
    oc.addColorStop(0.4, col(pal.deep, 0.10));
    oc.addColorStop(1, col(pal.deep, 0));
    g.fillStyle = oc;
    g.fillRect(box[0] - 0.1, box[1] - 0.1, box[2] - box[0] + 0.2, box[3] - box[1] + 0.2);

    fillDabs(g, dabs, pal);
    g.restore();

    if (rimPts && rimAlpha > 0) {
      g.save();
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.strokeStyle = col(rimCol, rimAlpha * 0.35);
      g.lineWidth = 0.026;
      smoothOpen(g, rimPts);
      g.stroke();
      g.strokeStyle = col(rimCol, rimAlpha);
      g.lineWidth = 0.010;
      smoothOpen(g, rimPts);
      g.stroke();
      g.restore();
    }
  }

  function furTufts(g, list, color) {
    g.fillStyle = color;
    for (const t of list) {
      const x = t[0], y = t[1], dx = t[2], dy = t[3], s = t[4];
      const nx = -dy, ny = dx;
      g.beginPath();
      g.moveTo(x - nx * s * 0.7, y - ny * s * 0.7);
      g.lineTo(x + dx * s * 1.5, y + dy * s * 1.5);
      g.lineTo(x + nx * s * 0.7, y + ny * s * 0.7);
      g.closePath();
      g.fill();
    }
  }

  /* ---- fox ---- */

  function drawFox(g, a) {
    const pal = FOX;
    const ph = a.phase;
    const wag = Math.sin(ph * 0.5 + 1.1) * 0.10 + Math.sin(a.wagT) * 0.04;

    // tail behind
    g.save();
    g.translate(-0.02, -0.49);
    g.rotate(wag);
    g.translate(0.02, 0.49);
    const tailPts = [
      [-0.01, -0.50], [-0.16, -0.62], [-0.38, -0.66], [-0.60, -0.58],
      [-0.57, -0.42], [-0.38, -0.31], [-0.20, -0.34], [-0.04, -0.40],
    ];
    const tail = closedPath(tailPts);
    g.fillStyle = col(pal.deep, 0.9);
    g.fill(tail);
    const tg = g.createLinearGradient(-0.60, -0.66, -0.05, -0.3);
    tg.addColorStop(0, col(pal.shadow));
    tg.addColorStop(0.5, col(pal.base));
    tg.addColorStop(1, col(pal.shadow));
    g.fillStyle = tg;
    g.fill(tail);
    // cream tip
    const tipPts = [
      [-0.60, -0.57], [-0.55, -0.64], [-0.44, -0.65], [-0.36, -0.58],
      [-0.39, -0.48], [-0.49, -0.41], [-0.57, -0.45],
    ];
    const tipG = g.createLinearGradient(-0.60, -0.65, -0.32, -0.38);
    tipG.addColorStop(0, col(pal.cream));
    tipG.addColorStop(0.65, col(pal.cream));
    tipG.addColorStop(1, col(pal.creamSh));
    g.fillStyle = tipG;
    g.fill(closedPath(tipPts));
    g.fillStyle = col(pal.creamSh, 0.55);
    g.beginPath();
    g.ellipse(-0.42, -0.42, 0.07, 0.035, 0.3, 0, TAU);
    g.fill();
    g.strokeStyle = col(pal.rim, 0.35);
    g.lineWidth = 0.012;
    smoothOpen(g, [[-0.06, -0.52], [-0.22, -0.60], [-0.42, -0.62], [-0.56, -0.56]]);
    g.stroke();
    g.restore();

    // far legs
    drawLeg(g, 0.14, -0.31, 0.29, ph + Math.PI + 0.4, 0.055, col(pal.deep), null, 0.055);
    drawLeg(g, 0.51, -0.33, 0.29, ph + 0.4, 0.055, col(pal.deep), null, 0.055);

    // body
    const bodyPts = [
      [0.60, -0.55], [0.71, -0.43], [0.66, -0.26], [0.45, -0.20],
      [0.20, -0.22], [0.02, -0.34], [-0.05, -0.50], [0.12, -0.60],
      [0.36, -0.62], [0.52, -0.61],
    ];
    const sil = closedPath(bodyPts);
    shadeBody(
      g, sil, [-0.08, -0.64, 0.73, -0.17], pal, a.dabsBody,
      [[0.10, -0.605], [0.28, -0.625], [0.45, -0.618], [0.57, -0.575]],
      pal.rim, 0.55
    );
    // chest cream
    g.save();
    g.clip(sil);
    g.fillStyle = col(pal.cream, 0.9);
    smoothOpen(g, [[0.70, -0.40], [0.63, -0.30], [0.64, -0.23], [0.71, -0.24]]);
    g.lineTo(0.71, -0.24);
    g.closePath();
    g.fill();
    g.fillStyle = col(pal.creamSh, 0.5);
    smoothOpen(g, [[0.68, -0.37], [0.645, -0.30], [0.655, -0.255], [0.70, -0.26]]);
    g.lineTo(0.70, -0.26);
    g.closePath();
    g.fill();
    g.restore();

    furTufts(g, [
      [0.10, -0.60, 0.10, -0.9, 0.035],
      [0.27, -0.62, 0.15, -0.98, 0.032],
      [0.45, -0.61, 0.12, -0.99, 0.030],
      [0.68, -0.38, 0.95, -0.25, 0.030],
    ], col(pal.base, 0.95));

    // near legs
    drawLeg(g, 0.20, -0.31, 0.30, ph + Math.PI, 0.06, col(pal.base), col(pal.rim, 0.4), 0.058);
    drawLeg(g, 0.58, -0.33, 0.30, ph, 0.06, col(pal.base), col(pal.rim, 0.4), 0.058);

    // head
    g.save();
    g.translate(0.55, -0.55);
    g.rotate(a.look * 0.55);

  /* ---- cat ---- */

  function drawCat(g, a) {
    const pal = CAT;
    const ph = a.phase;
    const wag = Math.sin(ph * 0.6) * 0.10 + Math.sin(a.wagT) * 0.05;

    // tail: tapered curve behind
    g.save();
    g.translate(-0.16, -0.36);
    g.rotate(wag);
    g.translate(0.16, 0.36);
    const tailPts = bezierPoints(
      [-0.16, -0.36], [-0.44, -0.40], [-0.56, -0.66], [-0.42, -0.90], 14
    );
    const tail = taperedPoly(tailPts, 0.075, 0.020);
    g.fillStyle = col(pal.deep, 0.9);
    g.save();
    g.translate(0.012, 0.014);
    g.fill(tail);
    g.restore();
    const tg = g.createLinearGradient(-0.5, -0.9, -0.2, -0.35);
    tg.addColorStop(0, col(pal.shadow));
    tg.addColorStop(0.55, col(pal.base));
    tg.addColorStop(1, col(pal.shadow));
    g.fillStyle = tg;
    g.fill(tail);
    g.strokeStyle = col(pal.rim, 0.4);
    g.lineWidth = 0.012;
    g.beginPath();
    g.moveTo(tailPts[2][0] - 0.028, tailPts[2][1]);
    for (let i = 3; i < tailPts.length - 2; i++) g.lineTo(tailPts[i][0] - 0.028, tailPts[i][1]);
    g.stroke();
    // tail rings
    g.strokeStyle = col(pal.shadow, 0.5);
    g.lineWidth = 0.02;
    for (let i = 5; i < 11; i += 2) {
      const p = tailPts[i];
      g.beginPath();
      g.moveTo(p[0] - 0.035, p[1] + 0.01);
      g.lineTo(p[0] + 0.035, p[1] - 0.01);
      g.stroke();
    }
    g.restore();

    // far legs
    drawLeg(g, 0.16, -0.26, 0.26, ph + Math.PI + 0.4, 0.05, col(pal.deep), null, 0.05);
    drawLeg(g, 0.47, -0.27, 0.26, ph + 0.4, 0.05, col(pal.deep), null, 0.05);

    // body
    const bodyPts = [
      [0.46, -0.44], [0.55, -0.36], [0.50, -0.24], [0.30, -0.18],
      [0.08, -0.20], [-0.12, -0.28], [-0.20, -0.40], [-0.08, -0.48],
      [0.16, -0.50], [0.34, -0.48],
    ];
    const sil = closedPath(bodyPts);
    shadeBody(
      g, sil, [-0.22, -0.52, 0.57, -0.16], pal, a.dabsBody,
      [[0.10, -0.485], [0.26, -0.50], [0.42, -0.475], [0.53, -0.41]],
      pal.rim, 0.55
    );
    g.save();
    g.clip(sil);
    g.fillStyle = col(pal.cream, 0.85);
    smoothOpen(g, [[0.54, -0.36], [0.50, -0.28], [0.50, -0.22], [0.56, -0.25]]);
    g.lineTo(0.56, -0.25);
    g.closePath();
    g.fill();
    g.restore();

    furTufts(g, [
      [0.12, -0.49, 0.05, -0.95, 0.022],
      [0.30, -0.50, 0.12, -0.95, 0.020],
      [0.45, -0.445, 0.6, -0.8, 0.018],
    ], col(pal.base, 0.9));

    // near legs
    drawLeg(g, 0.22, -0.26, 0.27, ph + Math.PI, 0.055, col(pal.base), col(pal.rim, 0.4), 0.052);
    drawLeg(g, 0.53, -0.27, 0.27, ph, 0.055, col(pal.base), col(pal.rim, 0.4), 0.052);

    // head
    g.save();
    g.translate(0.52, -0.52);
    g.rotate(a.look * 0.6);
    g.translate(-0.52, 0.52);
    const headPts = [
      [0.38, -0.58], [0.46, -0.655], [0.58, -0.645], [0.665, -0.57],
      [0.665, -0.475], [0.58, -0.425], [0.46, -0.435], [0.375, -0.50],
    ];
    const earFar = closedPath([[0.42, -0.60], [0.395, -0.80], [0.475, -0.70], [0.505, -0.62]]);
    const earNear = closedPath([[0.555, -0.625], [0.565, -0.825], [0.645, -0.71], [0.665, -0.605]]);
    const head = closedPath(headPts);
    head.addPath(earFar);
    head.addPath(earNear);
    shadeBody(
      g, head, [0.36, -0.83, 0.68, -0.41], pal, a.dabsHead,
      [[0.41, -0.60], [0.49, -0.655], [0.58, -0.64], [0.65, -0.565]],
      pal.rim, 0.55
    );
    g.save();
    g.clip(head);
    g.fillStyle = col(pal.inner, 0.9);
    g.fill(closedPath([[0.43, -0.61], [0.415, -0.775], [0.47, -0.70], [0.49, -0.625]]));
    g.fill(closedPath([[0.57, -0.63], [0.578, -0.80], [0.632, -0.715], [0.648, -0.615]]));
    g.fillStyle = col(pal.cream, 0.9);
    g.beginPath();
    g.ellipse(0.585, -0.485, 0.055, 0.042, 0.1, 0, TAU);
    g.fill();
    g.restore();

    drawEye(g, 0.605, -0.545, 0.028, 0.023, pal, a.blink);
    // pupil slit
    if (!a.blink) {
      g.fillStyle = hsl(40, 20, 6, 0.85);
      g.beginPath();
      g.ellipse(0.606, -0.545, 0.007, 0.018, 0, 0, TAU);
      g.fill();
    }
    g.fillStyle = col(pal.nose);
    g.beginPath();
    g.moveTo(0.668, -0.517);
    g.lineTo(0.652, -0.525);
    g.lineTo(0.652, -0.505);

    g.fill();
    g.strokeStyle = col(pal.deep, 0.6);

    g.beginPath();
    g.moveTo(0.66, -0.505);
    g.lineTo(0.66, -0.495);
    g.moveTo(0.66, -0.495);
    g.quadraticCurveTo(0.648, -0.487, 0.64, -0.495);
    g.moveTo(0.66, -0.495);
    g.quadraticCurveTo(0.672, -0.487, 0.68, -0.495);
    g.stroke();
    // whiskers
    g.strokeStyle = hsl(200, 20, 92, 0.30);
    g.lineWidth = 0.004;
    for (const dy of [-0.022, 0, 0.022]) {
      g.beginPath();
      g.moveTo(0.665, -0.505 + dy);
      g.quadraticCurveTo(0.75, -0.52 + dy, 0.81, -0.505 + dy * 1.6);
      g.stroke();

    g.restore();

  /* ---- duck ---- */

  function drawDuck(g, a) {
    const pal = DUCK;
    const ph = a.phase;
    const waddle = a.walking ? Math.sin(ph) * 0.035 : 0;

    g.save();
    g.rotate(waddle);

    // feet behind
    for (const [fx, off] of [[0.22, Math.PI], [0.36, 0]]) {
      const swing = a.walking ? Math.sin(ph + off) * 0.055 : 0;
      const fy = -Math.max(0, Math.cos(ph + off)) * 0.02;
      g.fillStyle = col(pal.deep, 0.85);
      g.beginPath();
      g.ellipse(fx + swing, fy + 0.012, 0.075, 0.022, 0.1, 0, TAU);
      g.fill();
      g.fillStyle = col(pal.bill);
      g.beginPath();
      g.ellipse(fx + swing, fy, 0.068, 0.018, 0.1, 0, TAU);
      g.fill();
      g.strokeStyle = col(pal.rim, 0.3);
      g.lineWidth = 0.006;
      g.beginPath();
      g.ellipse(fx + swing, fy - 0.004, 0.06, 0.012, 0.1, 0, Math.PI, TAU);
      g.stroke();

    // body
    const bodyPts = [
      [0.52, -0.34], [0.48, -0.19], [0.32, -0.10], [0.12, -0.125],
      [0.00, -0.22], [0.02, -0.34], [0.16, -0.42], [0.36, -0.42],

      [0.14, -0.23], [0.20, -0.32], [0.30, -0.37],

    wg.addColorStop(1, col(pal.shadow));
    g.fillStyle = wg;
    g.fill(wing);
    g.strokeStyle = col(pal.deep, 0.5);
    g.lineWidth = 0.008;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(0.24 + i * 0.06, -0.31 + i * 0.02);
      g.quadraticCurveTo(0.30 + i * 0.06, -0.26, 0.36 + i * 0.05, -0.22);
      g.stroke();
    }
    g.strokeStyle = col(pal.rim, 0.4);
    g.lineWidth = 0.01;
    smoothOpen(g, [[0.40, -0.36], [0.46, -0.29], [0.40, -0.21]]);
    g.stroke();

    // tail feathers
    g.fillStyle = col(pal.creamSh, 0.9);
    g.fill(closedPath([[0.02, -0.28], [-0.06, -0.34], [-0.04, -0.25], [0.02, -0.22]]));

    // head
    g.save();
    g.translate(0.48, -0.46);
    g.rotate(a.look * 0.5 + Math.sin(ph * 2) * 0.015);
    g.translate(-0.48, 0.46);
    const headPts = [
      [0.36, -0.48], [0.40, -0.58], [0.48, -0.64], [0.56, -0.62],

    ];

    shadeBody(
      g, head, [0.35, -0.66, 0.63, -0.37], pal, a.dabsHead,
      [[0.39, -0.58], [0.47, -0.635], [0.55, -0.615], [0.61, -0.55]],
      pal.rim, 0.5
    );

    const bill = closedPath([
      [0.59, -0.525], [0.70, -0.515], [0.755, -0.487], [0.71, -0.452],
      [0.60, -0.447],
    ]);
    g.fillStyle = col(pal.bill);
    g.fill(bill);
    g.fillStyle = hsl(30, 46, 62, 0.55);
    g.beginPath();
    g.ellipse(0.685, -0.505, 0.048, 0.013, 0.05, 0, TAU);
    g.fill();
    g.fillStyle = hsl(24, 40, 26, 0.55);

    g.quadraticCurveTo(0.68, -0.470, 0.73, -0.474);
    g.stroke();
    drawEye(g, 0.565, -0.555, 0.022, 0.020, pal, a.blink);
    // cheek
    g.fillStyle = hsl(348, 30, 66, 0.14);
    g.beginPath();
    g.ellipse(0.53, -0.475, 0.032, 0.02, 0, 0, TAU);
    g.fill();
    g.restore();

    // head fluff
    g.fillStyle = col(pal.base, 0.9);
    g.beginPath();
    g.ellipse(0.47, -0.655, 0.02, 0.014, 0.3, 0, TAU);
    g.fill();

    g.restore();
  }

  const SPECIES = {
    fox: {
      baseSize: 1.0, gait: 7.0, shadowW: 0.66,
      bodyDabs: 120, headDabs: 60,
      draw: drawFox,
    },
    cat: {
      baseSize: 0.90, gait: 5.2, shadowW: 0.62,
      bodyDabs: 100, headDabs: 50,
      draw: drawCat,
    },
    bunny: {
      baseSize: 0.82, gait: 6.2, shadowW: 0.55,
      bodyDabs: 90, headDabs: 46,
      draw: drawBunny,
    },
    duck: {
      baseSize: 0.70, gait: 9.0, shadowW: 0.48,
      bodyDabs: 80, headDabs: 40,
      draw: drawDuck,
    },
  };

  const CRITTER_DEFS = [
    { species: 'fox', xn: 0.30, lane: -0.30, dir: 1, speed: 0.022, size: 1.0, seed: 901 },
    { species: 'bunny', xn: 0.62, lane: 0.30, dir: -1, speed: 0.017, size: 1.0, seed: 902 },
    { species: 'cat', xn: 0.82, lane: -0.12, dir: -1, speed: 0.013, size: 1.0, seed: 903 },
    { species: 'duck', xn: 0.45, lane: 0.44, dir: 1, speed: 0.030, size: 1.0, seed: 904 },
  ];

  function buildCritters() {
    const prev = critters.map(c => ({ xn: c.xn, dir: c.dir }));
    critters.length = 0;
    CRITTER_DEFS.forEach((d, i) => {
      const p = prev[i];
      const sp = SPECIES[d.species];
      critters.push({
        ...d,
        xn: p ? p.xn : d.xn,
        dir: p ? p.dir : d.dir,
        fromDir: p ? p.dir : d.dir,
        turnT: 1,
        faceX: p ? p.dir : d.dir,
        phase: Math.random() * TAU,
        wait: 2 + Math.random() * 5,
        pauseT: 0,
        walking: true,
        blinkIn: 1 + Math.random() * 4,
        blinkT: 0,
        blink: false,
        look: 0,
        wagT: Math.random() * TAU,
        stepCd: 0,
        unit: 100,
        x: 0,
        y: 0,
        bob: 0,
        dabsBody: makeDabs(d.seed, [-0.2, -0.7, 0.75, -0.1], sp.bodyDabs),
        dabsHead: makeDabs(d.seed + 1, [0.3, -1.0, 0.92, -0.4], sp.headDabs),
      });
    });
  }

  function updateCritters(dt) {
    for (const a of critters) {
      const sp = SPECIES[a.species];
      a.wait -= dt;
      if (a.wait <= 0) {
        a.wait = 4 + Math.random() * 7;
        if (Math.random() < 0.6) a.pauseT = 1.0 + Math.random() * 2.4;
      }
      if (a.pauseT > 0) {
        a.pauseT -= dt;
        a.walking = false;
      } else {
        a.walking = true;
      }

      if (a.walking) {
        a.xn += a.dir * a.speed * dt;
        a.phase += dt * sp.gait;
      } else {
        a.phase += dt * 1.1;
      }

      if (a.xn < 0.045 && a.dir < 0) {
        a.dir = 1; a.fromDir = -1; a.turnT = 0; a.pauseT = Math.max(a.pauseT, 0.45);
      }
      if (a.xn > 0.955 && a.dir > 0) {
        a.dir = -1; a.fromDir = 1; a.turnT = 0; a.pauseT = Math.max(a.pauseT, 0.45);
      }
      a.xn = clamp(a.xn, 0.04, 0.96);

      a.turnT = Math.min(1, a.turnT + dt / 0.38);
      a.faceX = a.fromDir + (a.dir - a.fromDir) * smooth(a.turnT);
      if (Math.abs(a.faceX) < 0.18) a.faceX = (a.faceX < 0 ? -1 : 1) * 0.18;

      a.blinkIn -= dt;
      if (a.blinkIn <= 0) {
        a.blinkT = 0.12;
        a.blinkIn = 2 + Math.random() * 5;
      }
      a.blinkT = Math.max(0, a.blinkT - dt);
      a.blink = a.blinkT > 0;

      a.look = a.walking
        ? Math.sin(a.phase * 0.5) * 0.05
        : Math.sin(time * 0.9 + a.seed) * 0.14;
      a.wagT += dt * 2.2;

      const y = L.pathY(a.xn) + a.lane * L.pathHalf(a.xn) * 0.5;
      a.y = y;
      a.x = a.xn * W;
      a.unit = H * 0.175 * L.scaleAt(y) * SPECIES[a.species].baseSize * a.size;
      a.bob = Math.sin(a.phase * 2) * 0.012 * (a.walking ? 1 : 0.25);

      a.stepCd = Math.max(0, (a.stepCd || 0) - dt);
      if (a.walking && a.stepCd <= 0 && audio.on && L.puddles) {
        for (const p of L.puddles) {
          if (Math.hypot((a.x - p.x) / p.rx, (a.y - p.y) / p.ry) < 1.05) {
            waterStep(clamp((a.x / W) * 2 - 1, -0.8, 0.8), 0.85);
            a.stepCd = 0.55;
            break;
          }
        }
      }
    }
  }

  function renderCritter(g, a) {
    const sp = SPECIES[a.species];
    const u = a.unit;

    // pass 1: cast shadow, hue-shifted cool
    g.save();
    g.translate(a.x - u * 0.05, a.y + u * 0.012);
    g.scale(1, 0.30);
    const r = u * sp.shadowW;
    const sg = g.createRadialGradient(0, 0, 0, 0, 0, r);
    sg.addColorStop(0, hsl(230, 32, 9, 0.55));
    sg.addColorStop(0.5, hsl(230, 32, 11, 0.28));
    sg.addColorStop(1, hsl(230, 32, 13, 0));
    g.fillStyle = sg;
    g.beginPath();
    g.arc(0, 0, r, 0, TAU);
    g.fill();
    g.restore();

    // pass 2 + 3: body and rim
    g.save();
    g.translate(a.x, a.y);
    g.scale(a.faceX * u, u);
    g.translate(0, a.bob);
    sp.draw(g, a);
    g.restore();
  }

  function drawCritters(g) {
    const list = critters.slice().sort((p, q) => p.y - q.y);
    for (const a of list) renderCritter(g, a);
  }

  /* ---------- rain, splashes, ripples ---------- */

  function initRain() {
    rainLayers.length = 0;
    const defs = [
      { n: Math.round(W / 12), sp: 0.55, len: 0.030, a: 0.08, w: 0.8, wind: 0.20, splash: false },
      { n: Math.round(W / 9), sp: 0.95, len: 0.052, a: 0.13, w: 1.0, wind: 0.24, splash: true },
      { n: Math.round(W / 17), sp: 1.50, len: 0.085, a: 0.19, w: 1.3, wind: 0.28, splash: true },
    ];
    defs.forEach((d, li) => {
      const drops = [];
      for (let i = 0; i < d.n; i++) {
        drops.push(newDrop(d, li === 0));
      }
      rainLayers.push({ def: d, drops, index: li });
    });
  }

  function newDrop(def, noSplash) {
    const d = {
      x: Math.random() * (W * 1.2) - W * 0.1,
      y: Math.random() * H * 1.1 - H * 0.1,
      vy: H * def.sp * (0.75 + Math.random() * 0.5),
      len: H * def.len * (0.7 + Math.random() * 0.7),
      a: def.a * (0.55 + Math.random() * 0.9),
      w: def.w * (0.7 + Math.random() * 0.7),
      wind: def.wind * (0.85 + Math.random() * 0.3),
      landY: H * 0.999,
      splash: !noSplash && def.splash,
    };
    resetDrop(d, true);
    return d;
  }

  function resetDrop(d, initial) {
    d.x = Math.random() * (W * 1.25) - W * 0.12;
    d.y = initial ? Math.random() * H : -H * (0.04 + Math.random() * 0.2);
    d.landY = d.splash
      ? L.horizon + H * 0.02 + Math.random() * (H * 0.97 - L.horizon)
      : H * 1.02;
  }

  function updateRain(dt) {
    for (const layer of rainLayers) {
      for (const d of layer.drops) {
        d.y += d.vy * dt;
        d.x -= d.vy * d.wind * dt;
        if (d.y >= d.landY) {
          if (d.splash && splashes.length < 70 && Math.random() < 0.55) {
            spawnSplash(d.x, d.landY, 1);
          }
          resetDrop(d, false);
        }
        if (d.x < -W * 0.15) d.x += W * 1.3;
      }
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.age += dt;
      if (s.age > s.life) splashes.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.age += dt;
      if (r.age > r.life) rings.splice(i, 1);
    }
    // puddle impacts
    for (const p of L.puddles) {
      if (Math.random() < dt * 5) spawnRipple(p, 0.6 + Math.random() * 0.5);
    }
  }

  function drawRainLayer(g, index) {
    const layer = rainLayers[index];
    if (!layer) return;
    g.save();
    g.lineCap = 'round';
    for (const d of layer.drops) {
      const tx = d.x + d.len * d.wind;
      const ty = d.y - d.len;
      g.strokeStyle = hsl(206, 28, 78, d.a);
      g.lineWidth = d.w;
      g.beginPath();
      g.moveTo(d.x, d.y);
      g.lineTo(tx, ty);
      g.stroke();
      if (index === 2) {
        g.strokeStyle = hsl(200, 40, 92, d.a * 0.8);
        g.lineWidth = d.w * 1.3;
        g.beginPath();
        g.moveTo(d.x, d.y);
        g.lineTo(d.x + d.len * d.wind * 0.22, d.y - d.len * 0.22);
        g.stroke();
      }
    }
    g.restore();
  }

  function spawnSplash(x, y, strength) {
    if (splashes.length > 90) return;
    splashes.push({
      x, y,
      age: 0,
      life: 0.35 + Math.random() * 0.25,
      s: (2 + Math.random() * 4) * strength,
      drops: [
        { dx: (Math.random() - 0.5) * 14, vy: 40 + Math.random() * 60, vx: (Math.random() - 0.5) * 30, r: 0.8 + Math.random() },
        { dx: (Math.random() - 0.5) * 14, vy: 30 + Math.random() * 50, vx: (Math.random() - 0.5) * 30, r: 0.7 + Math.random() },
      ],
    });
  }

  function drawSplashes(g) {
    g.save();
    for (const s of splashes) {
      const t = s.age / s.life;
      const fade = 1 - t;
      const rx = s.s * (0.6 + t * 2.2);
      g.strokeStyle = hsl(205, 34, 82, 0.35 * fade);
      g.lineWidth = 1;
      g.beginPath();
      g.ellipse(s.x, s.y, rx, rx * 0.30, 0, 0, TAU);
      g.stroke();
      g.fillStyle = hsl(205, 34, 90, 0.30 * fade);
      for (const d of s.drops) {
        const px = s.x + d.dx + d.vx * s.age;
        const py = s.y - d.vy * s.age + 260 * s.age * s.age;
        g.beginPath();
        g.arc(px, py, d.r, 0, TAU);
        g.fill();
      }
    }
    g.restore();
  }

  function spawnRipple(p, strength) {
    if (rings.length > 60) return;
    const a = Math.random() * TAU;
    const rr = Math.sqrt(Math.random()) * 0.7;
    rings.push({
      p,
      x: p.x + Math.cos(a) * p.rx * rr,
      y: p.y + Math.sin(a) * p.ry * rr,
      age: 0,
      life: 0.9 + Math.random() * 0.5,
      strength,
    });
  }

  function drawPuddleDynamics(g, t) {
    // slow shimmer bands
    g.save();
    for (const p of L.puddles) {
      g.save();
      g.beginPath();
      g.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, TAU);
      g.clip();
      for (let i = 0; i < 3; i++) {
        const yy = p.y + Math.sin(t * 0.7 + i * 2.1 + p.seed) * p.ry * 0.5;
        g.fillStyle = hsl(204, 34, 66, 0.05);
        g.fillRect(p.x - p.rx, yy, p.rx * 2, 1.5);
      }
      g.restore();
    }
    g.restore();

    // ripples
    g.save();
    for (const r of rings) {
      const k = r.age / r.life;
      const fade = Math.pow(1 - k, 1.6);
      const rx = r.p.rx * (0.08 + k * 0.85);
      const ry = rx * 0.27;
      g.strokeStyle = hsl(202, 36, 84, 0.42 * fade * r.strength);
      g.lineWidth = Math.max(0.7, 1.6 * (1 - k));
      g.beginPath();
      g.ellipse(r.x, r.y, rx, ry, 0, 0, TAU);
      g.stroke();
      if (k > 0.12) {
        g.strokeStyle = hsl(206, 30, 62, 0.20 * fade * r.strength);
        g.beginPath();
        g.ellipse(r.x, r.y, rx * 0.62, ry * 0.62, 0, 0, TAU);
        g.stroke();
      }
    }
    g.restore();
  }

  /* ---------- beams, mist, motes ---------- */

  function drawBeams(g, t) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    const core = g.createRadialGradient(L.sunX, L.sunY, 0, L.sunX, L.sunY, H * 0.18);
    core.addColorStop(0, hsl(42, 72, 82, 0.30));
    core.addColorStop(0.25, hsl(38, 64, 70, 0.10));
    core.addColorStop(1, hsl(36, 54, 60, 0));
    g.fillStyle = core;
    g.fillRect(L.sunX - H * 0.2, L.sunY - H * 0.2, H * 0.4, H * 0.4);

    const beams = [
      { ang: 0.42, w: W * 0.055, a: 0.085, ph: 0.0 },
      { ang: 0.55, w: W * 0.085, a: 0.062, ph: 1.7 },
      { ang: 0.30, w: W * 0.045, a: 0.052, ph: 3.1 },
      { ang: 0.68, w: W * 0.070, a: 0.045, ph: 4.4 },
    ];
    for (const b of beams) {
      const pulse = 0.72 + 0.28 * Math.sin(t * 0.32 + b.ph);
      g.save();
      g.translate(L.sunX, L.sunY);
      g.rotate(b.ang);
      g.scale(1, 4.6);
      const r = b.w * (1 + 0.06 * Math.sin(t * 0.19 + b.ph));
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
      gr.addColorStop(0.00, hsl(38, 62, 72, b.a * pulse));
      gr.addColorStop(0.45, hsl(36, 55, 62, b.a * pulse * 0.45));
      gr.addColorStop(1.00, hsl(34, 50, 55, 0));
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, r, 0, TAU);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  function drawMist(g, t) {
    g.save();
    for (let i = 0; i < 4; i++) {
      const x = W * (0.05 + i * 0.28) + Math.sin(t * 0.045 + i * 1.7) * W * 0.06;
      const y = H * (0.625 + i * 0.043);
      const rx = W * (0.30 + i * 0.04);
      const ry = H * (0.032 + i * 0.006);
      g.save();
      g.translate(x, y);
      g.scale(1, ry / rx);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
      gr.addColorStop(0, col(C.mist, 0.075));
      gr.addColorStop(1, col(C.mist, 0));
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, rx, 0, TAU);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  function initMotes() {
    motes.length = 0;
    const rnd = rng(123);
    for (let i = 0; i < 18; i++) {
      motes.push({
        x: W * (0.08 + rnd() * 0.84),
        y: H * (0.48 + rnd() * 0.40),
        r: 1.0 + rnd() * 2.2,
        ph: rnd() * TAU,
        sp: 0.25 + rnd() * 0.55,
        amp: H * (0.01 + rnd() * 0.03),
        hue: rnd() < 0.62 ? 42 + rnd() * 16 : 168 + rnd() * 16,
        a: 0.25 + rnd() * 0.4,
      });
    }
  }

  function drawMotes(g, t) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const m of motes) {
      const x = m.x + Math.sin(t * m.sp + m.ph) * W * 0.02;
      const y = m.y + Math.sin(t * m.sp * 1.7 + m.ph * 2) * m.amp;
      const pulse = 0.65 + 0.35 * Math.sin(t * 1.8 + m.ph);
      const r = m.r * 7;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, hsl(m.hue, 70, 76, m.a * 0.55 * pulse));
      gr.addColorStop(0.35, hsl(m.hue, 60, 62, m.a * 0.20 * pulse));
      gr.addColorStop(1, hsl(m.hue, 50, 55, 0));
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
      g.fillStyle = hsl(m.hue, 60, 88, m.a * pulse);
      g.beginPath();
      g.arc(x, y, m.r, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  /* ---------- lantern pools + mushroom glow ---------- */

  function drawLightPools(g, t) {
    const Ln = L.lantern;
    const pulse = 0.92 + Math.sin(t * 1.6) * 0.05 + Math.sin(t * 4.1) * 0.02;
    g.save();
    g.globalCompositeOperation = 'lighter';
    // lantern pool on the ground
    g.save();
    g.translate(Ln.poolX, Ln.poolY);
    g.scale(1, Ln.poolRY / Ln.poolRX);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, Ln.poolRX);
    gr.addColorStop(0, hsl(38, 66, 60, 0.55 * pulse));
    gr.addColorStop(0.35, hsl(36, 60, 54, 0.28 * pulse));
    gr.addColorStop(0.75, hsl(34, 50, 46, 0.10 * pulse));
    gr.addColorStop(1, hsl(32, 40, 40, 0));
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, Ln.poolRX, 0, TAU);
    g.fill();
    g.restore();

    // warm reflection smeared down the wet path
    g.save();
    g.translate(Ln.poolX + W * 0.006, Ln.poolY - H * 0.055);
    g.scale(0.15, 1);
    const refl = g.createRadialGradient(0, 0, 0, 0, 0, H * 0.14);
    refl.addColorStop(0, hsl(38, 70, 62, 0.11 * pulse));
    refl.addColorStop(1, hsl(38, 70, 62, 0));
    g.fillStyle = refl;
    g.beginPath();
    g.arc(0, 0, H * 0.14, 0, TAU);
    g.fill();
    g.restore();

    // warm bounce on the near trunk
    g.save();
    g.translate(Ln.x - W * 0.02, Ln.y + H * 0.10);
    g.scale(1, 1.5);
    const bg2 = g.createRadialGradient(0, 0, 0, 0, 0, W * 0.10);
    bg2.addColorStop(0, hsl(38, 60, 58, 0.16 * pulse));
    bg2.addColorStop(1, hsl(38, 60, 58, 0));
    g.fillStyle = bg2;
    g.beginPath();
    g.arc(0, 0, W * 0.10, 0, TAU);
    g.fill();
    g.restore();

    // mushroom glow
    for (const m of L.mushrooms) {
      const p2 = 0.7 + 0.3 * Math.sin(t * 1.3 + m.seed);
      const r = m.s * 5.5;
      const mg = g.createRadialGradient(m.x, m.y - m.s * 0.6, 0, m.x, m.y - m.s * 0.6, r);
      mg.addColorStop(0, hsl(172, 62, 62, 0.20 * p2));
      mg.addColorStop(0.35, hsl(172, 58, 56, 0.08 * p2));
      mg.addColorStop(1, hsl(172, 50, 50, 0));
      g.fillStyle = mg;
      g.fillRect(m.x - r, m.y - m.s * 0.6 - r, r * 2, r * 2);
      // ground pool
      g.save();
      g.translate(m.x, m.y + m.s * 0.03);
      g.scale(1, 0.25);
      const gp = g.createRadialGradient(0, 0, 0, 0, 0, m.s * 1.5);
      gp.addColorStop(0, hsl(172, 60, 58, 0.14 * p2));
      gp.addColorStop(1, hsl(172, 60, 58, 0));
      g.fillStyle = gp;
      g.beginPath();
      g.arc(0, 0, m.s * 1.5, 0, TAU);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  /* ---------- post ---------- */

  function makeGrain() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const g = c.getContext('2d');
    const img = g.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = v;
      img.data[i + 1] = v;
      img.data[i + 2] = v;
      img.data[i + 3] = 30;
    }
    g.putImageData(img, 0, 0);
    grainPattern = ctx.createPattern(c, 'repeat');
  }

  function cacheGradients() {
    vignetteGrad = ctx.createRadialGradient(
      W * 0.5, H * 0.44, Math.min(W, H) * 0.22,
      W * 0.5, H * 0.46, Math.max(W, H) * 0.80
    );
    vignetteGrad.addColorStop(0.00, 'rgba(9,11,19,0)');
    vignetteGrad.addColorStop(0.62, 'rgba(10,12,22,0.16)');
    vignetteGrad.addColorStop(1.00, 'rgba(7,9,17,0.55)');

    gradeGrad = ctx.createLinearGradient(W, 0, 0, H);
    gradeGrad.addColorStop(0.0, 'rgba(255, 208, 148, 0.12)');
    gradeGrad.addColorStop(0.5, 'rgba(190, 170, 150, 0.02)');
    gradeGrad.addColorStop(1.0, 'rgba(84, 112, 176, 0.16)');
  }

  function drawPost(g) {
    g.save();
    g.globalCompositeOperation = 'screen';
    const wash = g.createRadialGradient(W * 0.80, H * 0.12, 0, W * 0.80, H * 0.12, W * 0.85);
    wash.addColorStop(0.00, 'rgba(255, 216, 164, 0.16)');
    wash.addColorStop(0.35, 'rgba(200, 180, 160, 0.05)');
    wash.addColorStop(1.00, 'rgba(90, 110, 150, 0.02)');
    g.fillStyle = wash;
    g.fillRect(0, 0, W, H);
    g.restore();

    g.save();
    g.globalCompositeOperation = 'soft-light';
    g.fillStyle = gradeGrad;
    g.fillRect(0, 0, W, H);
    g.restore();

    g.save();
    g.fillStyle = vignetteGrad;
    g.fillRect(0, 0, W, H);
    g.restore();

    if (grainPattern) {
      g.save();
      g.globalCompositeOperation = 'overlay';
      g.globalAlpha = 0.55;
      const ox = Math.floor(Math.random() * 128);
      const oy = Math.floor(Math.random() * 128);
      g.translate(-ox, -oy);
      g.fillStyle = grainPattern;
      g.fillRect(0, 0, W + 128, H + 128);
      g.restore();
    }

    // faint cold haze at the very bottom
    const b = g.createLinearGradient(0, H * 0.86, 0, H);
    b.addColorStop(0, 'rgba(20,30,52,0)');
    b.addColorStop(1, 'rgba(16,24,44,0.16)');
    g.fillStyle = b;
    g.fillRect(0, H * 0.86, W, H * 0.14);
  }

  /* ---------- background build ---------- */

  function buildBackground() {
    const g = bgc;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);

    drawSky(g);
    drawHills(g);
    drawGround(g);
    drawDistantTrees(g);
    drawFieldTufts(g);
    drawMeadowDetails(g);
    drawPath(g);
    for (const p of L.puddles) drawPuddleStatic(g, p);
    for (const tr of trees) drawTrunk(g, { ...tr.def, geo: tr.geo });
    drawBranch(g);
    for (const m of L.mushrooms) drawMushroom(g, m);
  }

  /* ---------- update / render ---------- */

  function update(dt) {
    time += dt;
    updateCritters(dt);
    updateRain(dt);
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);

    drawCanopies(ctx, time);
    drawBeams(ctx, time);
    drawMist(ctx, time);
    drawLightPools(ctx, time);
    drawLantern(ctx, time);
    drawPuddleDynamics(ctx, time);
    drawRainLayer(ctx, 0);
    drawCritters(ctx);
    drawSplashes(ctx);
    drawRainLayer(ctx, 1);
    drawMotes(ctx, time);
    drawForegroundGrass(ctx, time);
    drawFronds(ctx, time);
    drawRainLayer(ctx, 2);
    drawPost(ctx);
  }

  /* ---------- init ---------- */

  function initScene() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.max(320, window.innerWidth);
    H = Math.max(320, window.innerHeight);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    bg.width = cv.width;
    bg.height = cv.height;

    computeLayout();
    buildTrees();
    buildBackground();
    buildFronds();
    buildForegroundGrass();
    buildCritters();
    initRain();
    initMotes();
    makeGrain();
    cacheGradients();
  }

  function frame(ts) {
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    update(dt);
    render();
    rafId = requestAnimationFrame(frame);
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      initScene();
      if (!freeze) render();
    }, 140);
  });

  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    let best = null;
    let bd = 1e9;
    for (const p of L.puddles) {
      const d = Math.hypot((x - p.x) / p.rx, (y - p.y) / p.ry);
      if (d < bd) { bd = d; best = p; }
    }
    if (best && bd < 2.0) {
      for (let i = 0; i < 3; i++) spawnRipple(best, 1.2);
    }
    for (let i = 0; i < 5; i++) {
      spawnSplash(x + (Math.random() - 0.5) * 26, y + (Math.random() - 0.5) * 10, 1.4);
    }
  });

  /* ---------- cozy rain audio ---------- */

  const soundBtn = document.getElementById('sound');
  const audio = {
    ctx: null,
    master: null,
    pinkA: null,
    pinkB: null,
    brown: null,
    white: null,
    analyser: null,
    on: false,
    gen: 0,
  };

  function makeNoiseBuffer(ctx, seconds, type) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      if (type === 'pink') {
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179;
          b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520;
          b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522;
          b5 = -0.7616 * b5 - w * 0.0168980;
          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
          b6 = w * 0.115926;
        }
      } else if (type === 'white') {
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } else {
        let last = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          last = (last + 0.02 * w) / 1.02;
          d[i] = last * 3.5;
        }
      }
    }
    // normalise so the layers stay predictable
    let peak = 0;
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const v = Math.abs(d[i]);
        if (v > peak) peak = v;
      }
    }
    const scale = 0.85 / (peak || 1);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] *= scale;
    }
    return buf;
  }

  function buildAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = new AC();
    audio.ctx = ctx;

    const master = ctx.createGain();
    master.gain.value = 0.0001;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 26;
    comp.ratio.value = 2.5;
    comp.attack.value = 0.02;
    comp.release.value = 0.5;
    const an = ctx.createAnalyser();
    an.fftSize = 1024;
    master.connect(an);
    an.connect(comp);
    comp.connect(ctx.destination);
    audio.master = master;
    audio.analyser = an;

    const pinkA = makeNoiseBuffer(ctx, 7, 'pink');
    const pinkB = makeNoiseBuffer(ctx, 7, 'pink');
    const brown = makeNoiseBuffer(ctx, 7, 'brown');
    const white = makeNoiseBuffer(ctx, 5, 'white');
    audio.pinkA = pinkA;
    audio.pinkB = pinkB;
    audio.brown = brown;
    audio.white = white;

    const filt = (type, f, q) => {
      const b = ctx.createBiquadFilter();
      b.type = type;
      b.frequency.value = f;
      b.Q.value = q;
      return b;
    };
    const gain = v => {
      const g = ctx.createGain();
      g.gain.value = v;
      return g;
    };
    const pan = v => {
      const p = ctx.createStereoPanner();
      p.pan.value = v;
      return p;
    };

    // wide rain sheets, decorrelated left and right
    const srcA = ctx.createBufferSource();
    srcA.buffer = pinkA;
    srcA.loop = true;
    srcA.playbackRate.value = 0.97;
    const hpA = filt('highpass', 450, 0.6);
    const lpA = filt('lowpass', 7600, 0.4);
    const gA = gain(0.23);
    const pA = pan(-0.38);
    srcA.connect(hpA);
    hpA.connect(lpA);
    lpA.connect(gA);
    gA.connect(pA);
    pA.connect(master);
    srcA.start(0, Math.random() * 5);

    const srcB = ctx.createBufferSource();
    srcB.buffer = pinkB;
    srcB.loop = true;
    srcB.playbackRate.value = 1.04;
    const hpB = filt('highpass', 550, 0.6);
    const lpB = filt('lowpass', 6800, 0.4);
    const gB = gain(0.19);
    const pB = pan(0.38);
    srcB.connect(hpB);
    hpB.connect(lpB);
    lpB.connect(gB);
    gB.connect(pB);
    pB.connect(master);
    srcB.start(0, Math.random() * 5);

    // fine rain hiss
    const srcH = ctx.createBufferSource();
    srcH.buffer = white;
    srcH.loop = true;
    srcH.playbackRate.value = 1.0;
    const hpH = filt('highpass', 3400, 0.5);
    const lpH = filt('lowpass', 11000, 0.4);
    const gH = gain(0.055);
    srcH.connect(hpH);
    hpH.connect(lpH);
    lpH.connect(gH);
    gH.connect(master);
    srcH.start(0, Math.random() * 3);

    // low wet warmth, quiet so it does not read as wind
    const srcC = ctx.createBufferSource();
    srcC.buffer = brown;
    srcC.loop = true;
    const lpC = filt('lowpass', 180, 0.9);
    const gC = gain(0.075);
    srcC.connect(lpC);
    lpC.connect(gC);
    gC.connect(master);
    srcC.start(0, Math.random() * 5);

    // leaf patter, mid and high
    const bp = filt('bandpass', 2600, 0.55);
    const gD = gain(0.085);
    srcB.connect(bp);
    bp.connect(gD);
    gD.connect(master);

    const bp2 = filt('bandpass', 6200, 0.6);
    const gE = gain(0.030);
    srcH.connect(bp2);
    bp2.connect(gE);
    gE.connect(master);

    // slow gusts
    const lfo = (freq, depth, target) => {
      const o = ctx.createOscillator();
      o.frequency.value = freq;
      const g = gain(depth);
      o.connect(g);
      g.connect(target);
      o.start();
    };
    lfo(0.055, 0.045, gA.gain);
    lfo(0.083, 0.03, gB.gain);
    lfo(0.037, 0.03, gD.gain);
    lfo(0.11, 0.012, gH.gain);

    return true;
  }

  function scheduleDrop() {
    if (!audio.on || !audio.ctx) return;
    const gen = audio.gen;
    const ctx = audio.ctx;
    const t = ctx.currentTime + 0.01 + Math.random() * 0.08;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    const p = ctx.createStereoPanner();
    const f = 700 + Math.random() * 2200;
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * (0.55 + Math.random() * 0.4), t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.005 + Math.random() * 0.011, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09 + Math.random() * 0.10);
    p.pan.value = Math.random() * 1.7 - 0.85;
    o.connect(g);
    g.connect(p);
    p.connect(audio.master);
    o.start(t);
    o.stop(t + 0.3);
    setTimeout(() => {
      if (audio.on && gen === audio.gen) scheduleDrop();
    }, 120 + Math.random() * 320);
  }

  function waterStep(pan = 0, strength = 1) {
    if (!audio.on || !audio.ctx || !audio.master) return;
    const ctx = audio.ctx;
    const t = ctx.currentTime + 0.01;
    const out = ctx.createStereoPanner();
    out.pan.value = clamp(pan, -0.85, 0.85);
    out.connect(audio.master);

    // soft foot thump
    const o = ctx.createOscillator();
    const og = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120 + Math.random() * 40, t);
    o.frequency.exponentialRampToValueAtTime(55 + Math.random() * 15, t + 0.12);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.linearRampToValueAtTime(0.030 * strength, t + 0.006);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
    o.connect(og);
    og.connect(out);
    o.start(t);
    o.stop(t + 0.25);

    // splash
    if (audio.white) {
      const src = ctx.createBufferSource();
      src.buffer = audio.white;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1400 + Math.random() * 1400;
      bp.Q.value = 0.7;
      const sg = ctx.createGain();
      sg.gain.setValueAtTime(0.0001, t);
      sg.gain.linearRampToValueAtTime(0.024 * strength, t + 0.01);
      sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.15 + Math.random() * 0.10);
      src.connect(bp);
      bp.connect(sg);
      sg.connect(out);
      src.start(t, Math.random() * 4);
      src.stop(t + 0.35);
    }

    // droplets
    for (let i = 0; i < 3; i++) {
      const d = 0.02 + i * (0.03 + Math.random() * 0.03);
      const f = 1200 + Math.random() * 2200;
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(f, t + d);
      o2.frequency.exponentialRampToValueAtTime(f * 0.7, t + d + 0.04);
      g2.gain.setValueAtTime(0.0001, t + d);
      g2.gain.linearRampToValueAtTime(0.007 * strength, t + d + 0.004);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.08);
      o2.connect(g2);
      g2.connect(out);
      o2.start(t + d);
      o2.stop(t + d + 0.15);
    }
  }

  function scheduleThunder() {
    if (!audio.on || !audio.ctx) return;
    const gen = audio.gen;
    setTimeout(() => {
      if (!audio.on || gen !== audio.gen || !audio.ctx || !audio.brown) return;
      const ctx = audio.ctx;
      const t = ctx.currentTime + 0.05;
      const src = ctx.createBufferSource();
      src.buffer = audio.brown;
      src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 160;
      lp.Q.value = 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4.8);
      src.connect(lp);
      lp.connect(g);
      g.connect(audio.master);
      src.start(t, Math.random() * 4);
      src.stop(t + 5);
      scheduleThunder();
    }, 22000 + Math.random() * 34000);
  }

  function scheduleWaterStep() {
    if (!audio.on || !audio.ctx) return;
    const gen = audio.gen;
    setTimeout(() => {
      if (!audio.on || gen !== audio.gen) return;
      const p = (L.puddles && L.puddles.length)
        ? L.puddles[Math.floor(Math.random() * L.puddles.length)]
        : null;
      const pan = p ? clamp((p.x / W) * 2 - 1, -0.8, 0.8) : Math.random() * 1.6 - 0.8;
      waterStep(pan, 0.7 + Math.random() * 0.4);
      if (Math.random() < 0.35) {
        setTimeout(() => {
          if (audio.on && gen === audio.gen) waterStep(pan + 0.04, 0.55);
        }, 230 + Math.random() * 120);
      }
      scheduleWaterStep();
    }, 8000 + Math.random() * 14000);
  }

  function updateSoundButton() {
    if (!soundBtn) return;
    soundBtn.classList.toggle('on', audio.on);
    soundBtn.setAttribute('aria-pressed', audio.on ? 'true' : 'false');
  }

  function setAudio(on) {
    if (on && !audio.ctx) {
      if (!buildAudio()) return;
    }
    if (!audio.ctx) return;
    audio.on = on;
    audio.gen++;
    const ctx = audio.ctx;
    const g = audio.master.gain;
    const t = ctx.currentTime;
    if (on) {
      if (ctx.state === 'suspended') ctx.resume();
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(0.78, t + 1.8);
      scheduleDrop();
      scheduleThunder();
      scheduleWaterStep();
    } else {
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(0.0001, t + 0.9);
      setTimeout(() => {
        if (!audio.on && audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend();
      }, 1400);
    }
    updateSoundButton();
  }

  if (soundBtn) {
    if (!(window.AudioContext || window.webkitAudioContext)) {
      soundBtn.style.display = 'none';
    } else {
      soundBtn.addEventListener('click', () => setAudio(!audio.on));
    }
  }

  const params = new URLSearchParams(location.search);
  const seekT = parseFloat(params.get('t') || '0');
  const freeze = params.get('freeze') === '1';

  initScene();
  if (seekT > 0) {
    const steps = Math.round(seekT * 60);
    for (let i = 0; i < steps; i++) update(1 / 60);
  }
  render();
  if (!freeze) {
    lastTs = 0;
    rafId = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
